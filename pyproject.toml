
## `pyproject.toml`
```toml
[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypolayers"
version = "1.0.0"
authors = [
    {name = "Orchid Chetia Phukan"},
    {name = "Girish"},
    {name = "Mohd Mujtaba Akhtar"},
    {name = "Swarup Ranjan Behera"},
    {name = "Pailla Balakrishna Reddy"},
    {name = "Arun Balaji Buduru"},
    {name = "Rajesh Sharma"}
]
description = "HYFuse: Hyperbolic fusion of heterogeneous speech representations for emotion recognition"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["tensorflow>=2.9"]

[tool.setuptools.packages.find]
include = ["hypolayers*"]
